name: Deep Auth Verification

on:
  pull_request:
    branches: [main]

jobs:
  deep-auth:
    name: Production auth and SEO smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sage_prime_starter
      CLERK_SECRET_KEY: sk_test_c2VvLWNpLmludmFsaWQk
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_c2VvLWNpLmludmFsaWQk
      NEXT_PUBLIC_SENTRY_DISABLED: 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: 24.x

      - name: Production build with strict SEO gates
        env:
          APP_ENV: production
          SEO_AUDIT_LOCAL: 'true'
          SITE_URL: https://seo-ci.invalid
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3008
        run: pnpm build

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Start production audit server
        shell: bash
        env:
          APP_ENV: production
          SEO_AUDIT_LOCAL: 'true'
          SITE_URL: https://seo-ci.invalid
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3123
        run: |
          pnpm exec next start -p 3123 -H 127.0.0.1 > /tmp/next-audit.log 2>&1 &
          echo $! > /tmp/next-audit.pid
          for i in {1..60}; do
            if curl --max-time 3 -fsS -A 'sage-prime-seo-audit' http://127.0.0.1:3123/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/next-audit.log
          exit 1

      - name: Verify strict SEO audit path and localized auth symmetry
        shell: bash
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3123
          audit_ua='sage-prime-seo-audit'

          expect_200() {
            route="$1"
            body=$(mktemp)
            code=$(curl --max-time 10 -sS -A "$audit_ua" -o "$body" -w '%{http_code}' "$base$route")
            echo "AUDIT $route -> $code"
            test "$code" = '200'
            ! grep -qiE 'Internal Server Error|Application error' "$body"
          }

          for route in / /fr /sign-in /sign-up /fr/sign-in /fr/sign-up /robots.txt /sitemap.xml /rss.xml /api/health; do
            expect_200 "$route"
          done

          redirect_check() {
            route="$1"; expected="$2"; headers=$(mktemp)
            code=$(curl --max-time 10 -sS -A "$audit_ua" -o /dev/null -D "$headers" -w '%{http_code}' "$base$route")
            location=$(awk 'BEGIN{IGNORECASE=1} /^location:/{sub(/^[^:]*:[[:space:]]*/,""); gsub(/\r/,""); print; exit}' "$headers")
            echo "PROTECTED $route -> $code -> $location"
            case "$code" in 302|303|307|308) ;; *) exit 1;; esac
            echo "$location" | grep -F "$expected" >/dev/null
          }

          redirect_check /dashboard /sign-in
          redirect_check /fr/dashboard /fr/sign-in
          redirect_check /onboarding/organization-selection /sign-in
          redirect_check /fr/onboarding/organization-selection /fr/sign-in

      - name: Browser-render all localized auth audit routes
        shell: bash
        run: |
          node <<'NODE'
          const { chromium } = require('@playwright/test');
          (async () => {
            const browser = await chromium.launch({ headless: true });
            const page = await browser.newPage({ userAgent: 'sage-prime-seo-audit' });
            for (const route of ['/sign-in', '/sign-up', '/fr/sign-in', '/fr/sign-up']) {
              const response = await page.goto(`http://127.0.0.1:3123${route}`, { waitUntil: 'domcontentloaded' });
              if (!response || response.status() !== 200) throw new Error(`${route}: ${response?.status()}`);
              const html = await page.content();
              if (/Internal Server Error|Application error/i.test(html)) throw new Error(`${route}: error body`);
              if (!(await page.title()).trim()) throw new Error(`${route}: missing title`);
              console.log(`${route}: browser render OK`);
            }
            await browser.close();
          })().catch(error => { console.error(error); process.exit(1); });
          NODE

      - name: Stop production audit server
        if: always()
        run: kill "$(cat /tmp/next-audit.pid)" 2>/dev/null || true

      - name: Start normal middleware server with audit bypass disabled
        shell: bash
        env:
          APP_ENV: development
          SEO_AUDIT_LOCAL: 'false'
          SITE_URL: http://127.0.0.1:3008
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3008
        run: |
          pnpm exec next start -p 3008 -H 127.0.0.1 > /tmp/next-normal.log 2>&1 &
          echo $! > /tmp/next-normal.pid
          for i in {1..60}; do
            if curl --max-time 3 -sS -o /dev/null http://127.0.0.1:3008/; then exit 0; fi
            sleep 1
          done
          cat /tmp/next-normal.log
          exit 1

      - name: Prove SEO direct header cannot bypass middleware when disabled
        shell: bash
        run: |
          set -euo pipefail
          base=http://127.0.0.1:3008
          for route in /sign-in /sign-up /fr/sign-in /fr/sign-up; do
            normal=$(curl --max-time 10 -sS -A 'Mozilla/5.0 normal-user' -o /dev/null -w '%{http_code}' "$base$route")
            direct=$(curl --max-time 10 -sS -A 'Mozilla/5.0 normal-user' -H 'x-seo-audit-direct: 1' -o /dev/null -w '%{http_code}' "$base$route")
            echo "$route normal=$normal direct-header=$direct"
            test "$normal" = "$direct"
          done

          en_signin=$(curl --max-time 10 -sS -A 'Mozilla/5.0 normal-user' -o /dev/null -w '%{http_code}' "$base/sign-in")
          fr_signin=$(curl --max-time 10 -sS -A 'Mozilla/5.0 normal-user' -o /dev/null -w '%{http_code}' "$base/fr/sign-in")
          en_signup=$(curl --max-time 10 -sS -A 'Mozilla/5.0 normal-user' -o /dev/null -w '%{http_code}' "$base/sign-up")
          fr_signup=$(curl --max-time 10 -sS -A 'Mozilla/5.0 normal-user' -o /dev/null -w '%{http_code}' "$base/fr/sign-up")
          echo "normal middleware symmetry: sign-in $en_signin/$fr_signin; sign-up $en_signup/$fr_signup"
          test "$en_signin" = "$fr_signin"
          test "$en_signup" = "$fr_signup"

      - name: Stop normal middleware server
        if: always()
        run: kill "$(cat /tmp/next-normal.pid)" 2>/dev/null || true

      - name: Run existing Playwright E2E suite
        env:
          APP_ENV: development
          SEO_AUDIT_LOCAL: 'false'
          SITE_URL: http://localhost:3008
          NEXT_PUBLIC_APP_URL: http://localhost:3008
        run: pnpm test:e2e -- --project=chromium

      - name: Show server logs on failure
        if: failure()
        shell: bash
        run: |
          echo '--- audit server ---'; cat /tmp/next-audit.log 2>/dev/null || true
          echo '--- normal server ---'; cat /tmp/next-normal.log 2>/dev/null || true
