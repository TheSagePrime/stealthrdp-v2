name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sage_prime_starter

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore or cache Next.js build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: nextjs-${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}

      - name: Build and run SEO gates
        run: pnpm run build
        env:
          # The synthetic audit is refused when APP_ENV=production (see src/proxy.ts),
          # so audit as a preview build. This matches the Dockerfile.
          APP_ENV: preview
          SEO_AUDIT_LOCAL: 'true'
          SEO_AUDIT_SITE_URL: https://seo-ci.invalid
          NEXT_PUBLIC_SENTRY_DISABLED: 'true'
          NEXT_PUBLIC_APP_URL: http://localhost:3008
          SITE_URL: https://seo-ci.invalid

      - name: Upload SEO audit report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: seo-audit-report
          path: |
            reports/seo-audit.txt
            reports/seo-audit.json
          if-no-files-found: ignore
          retention-days: 1

      - name: Show SEO audit on failure
        if: failure()
        run: cat reports/seo-audit.txt || true

      - name: Upload SEO audit on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: seo-audit-failure
          path: reports/seo-audit.*
          if-no-files-found: ignore
          retention-days: 1

      - if: matrix.node-version == '24.x' && success()
        name: Cache Next.js build output
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .next
            next-env.d.ts
          key: nextjs-build-${{ matrix.node-version }}-${{ github.sha }}

  static:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sage_prime_starter

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - if: github.event_name == 'pull_request'
        name: Validate all commits from PR
        run: pnpm exec commitlint --from $BASE_SHA --to $HEAD_SHA --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Enforce architecture, design, SEO, and security contracts
        run: pnpm run check:architecture

      - name: Prove architecture/design contract rejection behavior
        run: pnpm run test:contracts

      - name: Prove security rejection behavior
        run: pnpm run test:security

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - if: github.event_name == 'pull_request'
        name: Require approval for protected architecture changes
        run: node scripts/check-governance.mjs "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARCHITECTURE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'architecture-approved') }}

      - name: Linter
        run: pnpm exec next typegen && pnpm run check:oxlint && pnpm run check:format

      - name: Type checking
        run: pnpm run check:types

      - name: Check dependencies
        if: vars.ENABLE_KNIP == 'true'
        run: pnpm run check:deps

      - name: I18n check
        run: pnpm run check:i18n

  unit:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sage_prime_starter

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit tests
        run: pnpm run test -- --coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        if: vars.ENABLE_CODECOV == 'true'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  storybook:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sage_prime_starter

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook component and accessibility tests
        run: pnpm run storybook:test

  visual-quality:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sage_prime_starter

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Compare approved visual references
        run: pnpm run test:visual

      - name: Upload visual regression diffs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: visual-regression-diffs
          path: |
            .vitest-attachments/**
            vitest-test-results/**
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 1

  keyless-e2e:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run keyless E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sage_prime_starter

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
          restore-nextjs-cache: true

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Check the default UI without provider credentials
        run: pnpm run test:e2e:keyless

      - name: Upload default UI screenshots
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: keyless-e2e-default-ui
          path: test-results/**/default-ui.png
          if-no-files-found: warn
          retention-days: 1

      - name: Upload keyless E2E diagnostics
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: keyless-e2e-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 1

  integration-e2e:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run full E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, keyless-e2e]
    if: vars.ENABLE_E2E == 'true' && github.event_name == 'push'
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sage_prime_starter

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
          restore-nextjs-cache: true

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run full E2E tests
        run: pnpm run test:e2e

      - name: Fix test results permission
        if: failure()
        run: sudo chmod -R 777 test-results || true

      - name: Run visual regression tests
        uses: chromaui/action@98132da0fca2211fb41b3af7b49ce85176007851
        if: vars.ENABLE_CHROMATIC == 'true'
        with:
          playwright: true
          exitOnceUploaded: true
          outputDir: storybook-static
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: full-e2e-results
          path: test-results/
          retention-days: 1
