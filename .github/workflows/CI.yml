name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      matrix:
        node-version: [24.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    name: Build with ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLERK_SECRET_KEY: sk_test_c2VvLWNpLmludmFsaWQk
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sage_prime_starter
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_c2VvLWNpLmludmFsaWQk

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Restore or cache Next.js build
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .next/cache
          # Generate a new cache whenever packages or source files change.
          key: nextjs-${{ matrix.node-version }}-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('src/**') }}

      - name: Build and run SEO gates
        run: pnpm run build
        env:
          APP_ENV: production
          SEO_AUDIT_LOCAL: 'true'
          NEXT_PUBLIC_SENTRY_DISABLED: 'true'
          NEXT_PUBLIC_APP_URL: http://localhost:3008
          SITE_URL: https://seo-ci.invalid

      - if: matrix.node-version == '24.x' && success()
        name: Cache Next.js build output
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: |
            .next
            next-env.d.ts
          key: nextjs-build-${{ matrix.node-version }}-${{ github.sha }}

  static:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run static checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLERK_SECRET_KEY: sk_test_c2VvLWNpLmludmFsaWQk
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sage_prime_starter
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_c2VvLWNpLmludmFsaWQk

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - if: github.event_name == 'pull_request'
        name: Validate all commits from PR
        run: pnpm exec commitlint --from $BASE_SHA --to $HEAD_SHA --verbose
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}

      - name: Enforce architecture, design, SEO, and security contracts
        run: pnpm run check:architecture

      - name: Prove architecture/design contract rejection behavior
        run: pnpm run test:contracts

      - name: Prove security rejection behavior
        run: pnpm run test:security

      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

      - if: github.event_name == 'pull_request'
        name: Require approval for protected architecture changes
        run: node scripts/check-governance.mjs "$BASE_SHA" "$HEAD_SHA"
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          ARCHITECTURE_APPROVED: ${{ contains(github.event.pull_request.labels.*.name, 'architecture-approved') }}

      - name: Linter
        run: |
          pnpm exec next typegen
          pnpm run check:oxlint
          pnpm exec oxfmt src/app/api src/features/runtime src/features/billing/entitlements.ts src/features/billing/polar.ts src/features/billing/polar.test.ts src/features/billing/routes.test.ts
          git diff -- src/app/api src/features/runtime src/features/billing/entitlements.ts src/features/billing/polar.ts src/features/billing/polar.test.ts src/features/billing/routes.test.ts
          git diff --exit-code -- src/app/api src/features/runtime src/features/billing/entitlements.ts src/features/billing/polar.ts src/features/billing/polar.test.ts src/features/billing/routes.test.ts

      - name: Type checking
        run: pnpm run check:types

      - name: Check dependencies
        if: vars.ENABLE_KNIP == 'true'
        run: pnpm run check:deps

      - name: I18n check
        run: pnpm run check:i18n

  unit:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLERK_SECRET_KEY: sk_test_c2VvLWNpLmludmFsaWQk
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sage_prime_starter
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_c2VvLWNpLmludmFsaWQk

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run unit tests
        run: pnpm run test -- --coverage

      - name: Upload coverage reports to Codecov
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f
        if: vars.ENABLE_CODECOV == 'true'
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  storybook:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLERK_SECRET_KEY: sk_test_c2VvLWNpLmludmFsaWQk
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sage_prime_starter
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_c2VvLWNpLmludmFsaWQk

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Storybook component and accessibility tests
        run: pnpm run storybook:test

  visual-quality:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run visual regression
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CLERK_SECRET_KEY: sk_test_c2VvLWNpLmludmFsaWQk
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sage_prime_starter
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_c2VvLWNpLmludmFsaWQk

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Compare approved visual references
        run: pnpm run test:visual

      - name: Upload visual regression diffs
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: visual-regression-diffs
          path: |
            .vitest-attachments/**
            vitest-test-results/**
          if-no-files-found: ignore
          retention-days: 1

  e2e:
    strategy:
      matrix:
        node-version: [24.x]

    name: Run E2E tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build]
    if: vars.ENABLE_E2E == 'true' && github.event_name == 'push'
    env:
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sage_prime_starter
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}

    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0

      - name: Set up Node.js environment
        uses: ./.github/actions/setup-project
        with:
          node-version: ${{ matrix.node-version }}
          restore-nextjs-cache: true

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run E2E tests
        run: pnpm run test:e2e

      - name: Fix test results permission
        if: failure()
        run: sudo chmod -R 777 test-results || true

      - name: Run visual regression tests
        uses: chromaui/action@98132da0fca2211fb41b3af7b49ce85176007851
        if: vars.ENABLE_CHROMATIC == 'true'
        with:
          playwright: true
          exitOnceUploaded: true
          outputDir: storybook-static
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: failure()
        with:
          name: test-results
          path: test-results/
          retention-days: 1

