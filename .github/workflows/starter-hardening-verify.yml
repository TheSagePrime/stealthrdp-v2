name: Starter Hardening Verification

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLERK_SECRET_KEY: sk_test_c2VvLWNpLmludmFsaWQk
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_c2VvLWNpLmludmFsaWQk
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/sage_prime_starter
      APP_ENV: production
      SITE_URL: https://seo-ci.invalid
      SEO_AUDIT_LOCAL: 'true'
      NEXT_PUBLIC_SENTRY_DISABLED: 'true'
      NEXT_PUBLIC_APP_URL: http://localhost:3008

    steps:
      - uses: actions/checkout@v6

      - uses: ./.github/actions/setup-project
        with:
          node-version: 24.x

      - name: Print exact Oxfmt normalization
        shell: bash
        run: |
          pnpm exec oxfmt src/features/billing/routes.test.ts
          echo '---OXFMT-BEGIN---'
          cat src/features/billing/routes.test.ts
          echo '---OXFMT-END---'
          exit 1
