# Validate commit messages
commit-msg:
  jobs:
    - name: commitlint
      run: pnpm exec commitlint --edit {1}

# Validate architecture and content before committing
pre-commit:
  jobs:
    - name: architecture-contract
      run: pnpm run check:architecture
      glob: '*'
    - name: lint
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      glob: '*'
      stage_fixed: true
    - name: check-types
      run: pnpm run check:types
      glob: '*.{ts,tsx}'
    - name: knip
      run: pnpm run check:deps
      glob: '*'
