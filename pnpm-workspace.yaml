allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  bufferutil: true
  core-js: true
  esbuild: true
  lefthook: true
  utf-8-validate: true
shellEmulator: true

trustPolicy: no-downgrade
packages:
  - .
overrides:
  brace-expansion@>=5.0.0 <5.0.11: '>=5.0.11'
  fast-uri: '>=3.1.7'
